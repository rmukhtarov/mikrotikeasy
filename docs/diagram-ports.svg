tCount="indefinite" path="M623 384 H405 V171 L340 171 C 260 171, 228 170, 152 170"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle><circle class="dg-anim dg-cw" r="3.5" opacity="0"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M623 78 H600 V171 H450 V300 H623"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle><circle class="dg-anim dg-bad" r="4.5" opacity="0"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M623 300 H450 V218"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></circle></g><g class="dg-part"><circle class="dg-anim dg-bad" r="4.5" opacity="0"><animateMotion dur="2.6s" begin="0.3s" repeatCount="indefinite" path="M152 144 C 238 144, 234 131, 290 167"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle><g class="dg-shield" transform="translate(294 171)"><path d="M0 -24 L18 -16 V2 C18 14 9 21 0 25 C-9 21 -18 14 -18 2 V-16 Z"/><path class="dg-check" d="M-7 0 l5 5 l9 -10"/></g><text class="dg-t dg-s" x="294" y="114" text-anchor="middle">Protection</text></g><g class="dg-part"><g class="dg-router"><rect x="330" y="128" width="150" height="86" rx="14"/><text class="dg-rt" x="405" y="162" text-anchor="middle">MikroTik</text><text class="dg-rs" x="405" y="180" text-anchor="middle">RB3011UiAS</text><circle class="dg-led" cx="360" cy="198" r="3.2" style="animation-delay:0s"/><circle class="dg-led" cx="378" cy="198" r="3.2" style="animation-delay:0.37s"/><circle class="dg-led" cx="396" cy="198" r="3.2" style="animation-delay:0.74s"/><circle class="dg-led" cx="414" cy="198" r="3.2" style="animation-delay:1.1099999999999999s"/><circle class="dg-led" cx="432" cy="198" r="3.2" style="animation-delay:0.17999999999999994s"/><circle class="dg-led" cx="450" cy="198" r="3.2" style="animation-delay:0.55s"/></g></g><g class="dg-part dg-on"><text class="dg-t dg-b" x="695" y="44" text-anchor="middle">Devices at home / in the office</text><text class="dg-t dg-s" x="695" y="58" text-anchor="middle">192.168.88.1/24</text><g class="dg-ico"><rect x="629" y="66" width="32" height="21" rx="3"/><path d="M624 91h42" stroke-width="3" stroke-linecap="round"/></g><text class="dg-t" x="675" y="83">Computer</text><g class="dg-ico"><rect x="637" y="113" width="16" height="29" rx="4"/><circle cx="645" cy="137" r="1.6" class="dg-fill"/></g><text class="dg-t" x="675" y="133">Phone</text><g class="dg-ico"><rect x="627" y="165" width="36" height="22" rx="3"/><path d="M637 192h16"/></g><text class="dg-t" x="675" y="183">TV</text></g><g class="dg-part dg-on"><text class="dg-port" x="196" y="160" text-anchor="middle">ether1</text><text class="dg-port" x="488" y="162">ether2–6</text><text class="dg-port" x="415" y="376">ether9</text><text class="dg-port" x="460" y="292">ether7, ether8</text></g><g class="dg-part"><path class="dg-camwall" d="M570 266 H808"/><text class="dg-t dg-s dg-camt" x="705" y="259" text-anchor="middle">🔒 Cameras cannot reach the LAN</text><g class="dg-ico"><rect x="628" y="291" width="26" height="17" rx="4"/><path d="M654 297l9-5v15l-9-5z"/></g><text class="dg-t dg-b" x="675" y="302">Cameras</text><text class="dg-t dg-s" x="675" y="317">192.168.50.1/24</text><text class="dg-t dg-s dg-camt" x="675" y="331">internet: no (time only)</text></g><g class="dg-part"><path class="dg-wall" d="M570 354 H808"/><text class="dg-t dg-s dg-wallt" x="705" y="347" text-anchor="middle">🔒 Guests cannot see your devices</text><g class="dg-ico"><rect x="637" y="369" width="16" height="29" rx="4"/><circle cx="645" cy="393" r="1.6" class="dg-fill"/></g><text class="dg-t" x="675" y="389">Guest's phone</text></g><g class="dg-badge"><circle cx="476" cy="132" r="10"/><text x="476" y="132">1</text><