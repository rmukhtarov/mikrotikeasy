<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 464" width="820" height="464" role="img" aria-label="Ports: which cable goes where">
<style>
.dg-t { fill: #1b1f24; font: 13px system-ui, "Segoe UI", sans-serif; }
.dg-b { font-weight: 700; }
.dg-s { fill: #5b6470; font-size: 11.5px; }
.dg-line { fill: none; stroke: #d8dde3; stroke-width: 3; stroke-linecap: round; }
.dg-wan-act { stroke: color-mix(in srgb, #3fb950 70%, #d8dde3); }
.dg-wan-stby { stroke: #d8dde3; stroke-dasharray: 6 6; }
.dg-wan-down { stroke: #f85149; stroke-dasharray: 3 7; opacity: .7; }
.dg-guest { stroke: color-mix(in srgb, #d29922 60%, #d8dde3); }
.dg-fwd { stroke: color-mix(in srgb, #f08c2e 55%, transparent); stroke-width: 2; stroke-dasharray: 2 6; }
.dg-cloud circle, .dg-cloud rect { fill: color-mix(in srgb, #4aa3df 22%, #ffffff); stroke: none; }
.dg-cloud-down circle, .dg-cloud-down rect { fill: color-mix(in srgb, #f85149 16%, #ffffff); }
.dg-cloud-stby circle, .dg-cloud-stby rect { opacity: .55; }
.dg-st-act { fill: #3fb950; }
.dg-st-down { fill: #f85149; }
.dg-x { fill: #f85149; font: 700 22px system-ui, sans-serif; }
.dg-router rect { fill: color-mix(in srgb, #0f7f73 16%, #ffffff); stroke: #0f7f73; stroke-width: 2.5; }
.dg-rt { fill: #1b1f24; font: 700 15px system-ui, "Segoe UI", sans-serif; }
.dg-rs { fill: #5b6470; font: 11.5px system-ui, sans-serif; }
.dg-led { fill: #3fb950; animation: dg-blink 1.3s infinite; }
.dg-ant { stroke: #0f7f73; stroke-width: 3; stroke-linecap: round; }
.dg-waves path { fill: none; stroke: #0f7f73; stroke-width: 2.4; stroke-linecap: round; animation: dg-blink 1.6s infinite; }
.dg-shield path:first-child { fill: color-mix(in srgb, #3fb950 20%, #ffffff); stroke: #3fb950; stroke-width: 2.2; }
.dg-check { fill: none; stroke: #3fb950; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dg-ico rect, .dg-ico path { fill: none; stroke: #1b1f24; stroke-width: 2; stroke-linejoin: round; }
.dg-ico .dg-fill { fill: #1b1f24; }
.dg-ok { fill: #3fb950; }
.dg-bad { fill: #f85149; }
.dg-fw { fill: #f08c2e; }
.dg-fwt { fill: #c8701f; }
.dg-wall { stroke: #f85149; stroke-width: 2; stroke-dasharray: 8 5; }
.dg-wallt { fill: #f85149; }
.dg-geo rect { stroke-width: 1.5; }
.dg-geo-allow rect { fill: color-mix(in srgb, #3fb950 15%, #ffffff); stroke: #3fb950; }
.dg-geo-block rect { fill: color-mix(in srgb, #f85149 12%, #ffffff); stroke: #f85149; }
.dg-geo text { fill: #1b1f24; font: 600 11.5px system-ui, sans-serif; }
.dg-part { transition: opacity .35s ease; }
.dg-part[data-dg-go], .dg-badge {  outline: none; }
.dg-part[data-dg-go]:hover, .dg-part[data-dg-go]:focus-visible { filter: drop-shadow(0 0 4px color-mix(in srgb, #0f7f73 65%, transparent)); }
.dg-on { animation: dg-glow 1.7s ease-in-out infinite; }
@keyframes dg-glow { 0%, 100% { filter: drop-shadow(0 0 1px color-mix(in srgb, #0f7f73 40%, transparent)); } 50% { filter: drop-shadow(0 0 9px #0f7f73); } }
.dg-badge circle { fill: #ffffff; stroke: #0f7f73; stroke-width: 1.6; transition: fill .2s; }
.dg-badge text { fill: #0f7f73; font: 700 11px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.dg-badge:hover circle, .dg-badge:focus-visible circle { fill: color-mix(in srgb, #0f7f73 25%, #ffffff); }
.dg-badge-on circle { fill: #0f7f73; }
.dg-badge-on text { fill: #ffffff; }
.dg-badge-on { animation: dg-pop 1.7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes dg-pop { 50% { transform: scale(1.22); } }
.dg-on .dg-router rect, .dg-on .dg-shield path:first-child { stroke-width: 3.5; }
.dg-port { fill: #0f7f73; font: 700 12px ui-monospace, Consolas, monospace; }
.dg-port-off { fill: #5b6470; }
.dg-wifit { font-size: 12px; fill: #0f7f73; }
.dg-k0 { background: #3fb950; }
.dg-k1 { background: #f85149; }
.dg-k2 { background: #f08c2e; }
@keyframes dg-blink { 50% { opacity: .35; } }
.dg-pmg { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-top: 6px; }
.dg-pmi { display: flex; flex-direction: column; gap: 1px; border: 1px solid #d8dde3; border-left: 4px solid #d8dde3; border-radius: 6px; padding: 4px 8px; background: #ffffff; min-width: 0; }
.dg-pmi code { font: 700 12px ui-monospace, Consolas, monospace; color: #1b1f24; }
.dg-pmi span { color: #5b6470; }
.dg-pmi em { font-style: normal; color: #1b1f24; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dg-camline { stroke: color-mix(in srgb, #8b6fd6 65%, #d8dde3); }
.dg-camwall { stroke: #8b6fd6; stroke-width: 2; stroke-dasharray: 8 5; }
.dg-camt { fill: #8b6fd6; }
.dg-cw { fill: #8b6fd6; }
.bgc { fill: #ffffff; stroke: #d8dde3; }
.cap { fill: #0f7f73; font: 600 13px system-ui, "Segoe UI", sans-serif; }</style>
<rect class="bgc" x="0.5" y="0.5" width="819" height="463" rx="14"/>
<text class="cap" x="18" y="24">Ports: which cable goes where</text>
