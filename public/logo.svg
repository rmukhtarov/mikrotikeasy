<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MikrotikEasy">
  <!-- step-by-step answers (1 - 2 - done) flow down into a configured router -->
  <defs>
    <linearGradient id="me-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd0b6"/>
      <stop offset="1" stop-color="#0a5f56"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#me-bg)"/>
  <!-- stepper -->
  <path d="M14 15.5h36" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>
  <circle cx="14" cy="15.5" r="4" fill="#fff" opacity=".7"/>
  <circle cx="29" cy="15.5" r="4" fill="#fff" opacity=".85"/>
  <circle cx="47" cy="15.5" r="7" fill="#fff"/>
  <path d="M43.6 15.6l2.4 2.4 4.4-4.8" fill="none" stroke="#0b6b60" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the result flows into the router -->
  <path d="M47 22.5v6.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M43.8 26.6l3.2 3.2 3.2-3.2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- router with a config prompt -->
  <rect x="9" y="33" width="46" height="20" rx="5" fill="none" stroke="#fff" stroke-width="3.4"/>
  <path d="M16 39.5l4.2 3.5-4.2 3.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M23.5 46.5h7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fff">
    <circle cx="40" cy="43" r="2.3"/>
    <circle cx="47" cy="43" r="2.3"/>
  </g>
</svg>
